; Family Hub ESP32-S3 thin client firmware
; Production panel: Waveshare ESP32-S3-Touch-LCD-7B (1024x600, init-free RGB) — env waveshare7b
; (devkit env = headless serial UI for development)

[platformio]
default_envs = devkit

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv
lib_deps =
    bblanchon/ArduinoJson@^7.2.1

[env:devkit]
board = esp32-s3-devkitc-1
build_src_filter =
  +<*>
  -<main.cpp>
  -<display.cpp>
  -<child_focus_state.cpp>
  -<child/>
  +<shared/api/>
  +<shared/ui/>
  +<shared/state_cache/>
  +<shared/display/>
  +<shared/diagnostics/>
  +<household/>
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DFAMILY_HUB_DEVKIT=1
    -DFAMILY_HUB_APP_HOUSEHOLD=1
    -DFIRMWARE_VERSION=\"0.1.0\"

[env:waveshare7b]
; Waveshare ESP32-S3-Touch-LCD-7B (Type B) — 1024x600 init-free RGB panel
; (ST7262-class), GT911 touch, CH32V003 IO extension. Values verified against
; the official BSP: github.com/waveshareteam/ESP32-S3-Touch-LCD-7B — see
; docs/waveshare-esp32-s3-touch-lcd-7b-reference.md.
; Module: ESP32-S3-WROOM-1-N16R8 (16MB Flash / 8MB OPI PSRAM).
;
; Platform override: the BSP's RGB-panel config needs the IDF 5 esp_lcd API
; (num_fbs, bounce_buffer_size_px), which Arduino core 2.x (espressif32@6.9.0,
; IDF 4.4) does not have. pioarduino ships Arduino core 3.x on IDF 5.x.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = waveshare_esp32_s3_touch_lcd_7b
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = partitions_16MB.csv
monitor_filters = esp32_exception_decoder
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DWAVESHARE_7B=1
    -DBOARD_HAS_PSRAM
    -DFIRST_BOOT_DIAG=0
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_CONF_PATH=${PROJECT_DIR}/include/lv_conf.h
    -I include
    -DFAMILY_HUB_APP_HOUSEHOLD=1
    -DFAMILY_HUB_FIRMWARE_KIND=\"household\"
    -DFIRMWARE_VERSION=\"1.0.4\"
lib_deps =
    bblanchon/ArduinoJson@^7.2.1
    lvgl/lvgl@^8.4.0
build_src_filter =
  +<*>
  -<main.cpp>
  -<display.cpp>
  -<child_focus_state.cpp>
  -<api_client.cpp>
  -<ui_manager.cpp>
  -<state_cache.cpp>
  -<child/>
  +<household/>
  +<shared/>
; Set -DFIRST_BOOT_DIAG=0 after first hardware bring-up passes (skips the
; boot color bars + 8s touch echo, keeps the I2C scan + stage logging).

[env:waveshare7b-public]
; Public-prep image: no Wi-Fi PSK / write-token bake-in from secrets.h.
; Provision Wi-Fi via NVS keys wifi_ssid / wifi_pass; server host/token via
; Diagnostics → Settings (or NVS). SoftAP + C5 hashed panel auth stay gated.
extends = env:waveshare7b
build_flags =
    ${env:waveshare7b.build_flags}
    -DFAMILY_HUB_PUBLIC_BUILD=1

[env:waveshare7b-household-launcher]
; Household-only M5 Launcher app (dashboard + chore completion).
extends = env:waveshare7b
board_build.partitions = partitions_launcher_16MB.csv
build_src_filter =
  +<*>
  -<main.cpp>
  -<display.cpp>
  -<child_focus_state.cpp>
  -<api_client.cpp>
  -<ui_manager.cpp>
  -<state_cache.cpp>
  -<child/>
  +<household/>
  +<shared/>
build_flags =
    ${env:waveshare7b.build_flags}
    -DFAMILY_HUB_LAUNCHER_BUILD=1
custom_launcher_output_bin = family-hub-household.bin
extra_scripts = post:launcher_copy.py

[env:elecrow7]
; Secondary panel — compile stubs only until LovyanGFX stack added (see docs/elecrow-esp32-display-7-reference.md)
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_upload.flash_size = 4MB
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DELECROW_7=1
    -DBOARD_HAS_PSRAM
    -DFIRMWARE_VERSION=\"0.1.0\"
; TODO when Elecrow hardware in hand:
; 1. Install esp32-s3-devkitc-1-myboard.json from Elecrow wiki into PlatformIO boards/
; 2. board = esp32-s3-devkitc-1-myboard
; 3. lib_deps = ${env.lib_deps}, lovyanfx/LovyanGFX, lvgl/lvgl@8.3.11, GT911, PCA9557
; 4. Copy Elecrow lv_conf.h + touch.h from wiki demo zip — NOT Waveshare libs
