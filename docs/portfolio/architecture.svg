<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
  <title id="title">Family Hub architecture</title>
  <desc id="desc">Waveshare panel talks to local Node and SQLite over LAN with PANEL_TOKEN. Browser humans use Clerk through an optional Cloudflare Tunnel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2332"/>
      <stop offset="100%" stop-color="#0f1419"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7eb8d4"/>
    </marker>
  </defs>
  <rect width="1120" height="420" rx="16" fill="url(#bg)"/>
  <text x="40" y="48" fill="#e8eef4" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="22" font-weight="600">Family Hub architecture</text>
  <text x="40" y="74" fill="#93a4b5" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">Local source of truth - thin panel client - optional tunnel for humans</text>

  <rect x="40" y="120" width="240" height="220" rx="14" fill="#243447" stroke="#4d7ea8" stroke-width="2"/>
  <text x="160" y="158" text-anchor="middle" fill="#d7e6f2" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="16" font-weight="600">Waveshare panel</text>
  <text x="160" y="186" text-anchor="middle" fill="#93a4b5" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">ESP32-S3 / LVGL</text>
  <text x="160" y="220" text-anchor="middle" fill="#c5d6e6" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">Glance UI + gestures</text>
  <text x="160" y="244" text-anchor="middle" fill="#c5d6e6" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">Chore complete</text>
  <text x="160" y="268" text-anchor="middle" fill="#c5d6e6" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">Grocery toggle</text>
  <text x="160" y="304" text-anchor="middle" fill="#7eb8d4" font-family="IBM Plex Mono, monospace" font-size="12">LAN x-family-hub-token</text>

  <rect x="440" y="120" width="240" height="220" rx="14" fill="#243447" stroke="#5a9e78" stroke-width="2"/>
  <text x="560" y="158" text-anchor="middle" fill="#d7e6f2" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="16" font-weight="600">Local server</text>
  <text x="560" y="186" text-anchor="middle" fill="#93a4b5" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">Node / Express / SQLite</text>
  <text x="560" y="220" text-anchor="middle" fill="#c5d6e6" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">Source of truth</text>
  <text x="560" y="244" text-anchor="middle" fill="#c5d6e6" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">Panel view-models</text>
  <text x="560" y="268" text-anchor="middle" fill="#c5d6e6" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">Admin REST API</text>
  <text x="560" y="304" text-anchor="middle" fill="#7dcea0" font-family="IBM Plex Mono, monospace" font-size="12">SoT on LAN</text>

  <rect x="840" y="120" width="240" height="220" rx="14" fill="#243447" stroke="#c4a35a" stroke-width="2"/>
  <text x="960" y="158" text-anchor="middle" fill="#d7e6f2" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="16" font-weight="600">Browser admin</text>
  <text x="960" y="186" text-anchor="middle" fill="#93a4b5" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">Vanilla JS SPA</text>
  <text x="960" y="220" text-anchor="middle" fill="#c5d6e6" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">Full CRUD</text>
  <text x="960" y="244" text-anchor="middle" fill="#c5d6e6" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">Clerk session</text>
  <text x="960" y="268" text-anchor="middle" fill="#c5d6e6" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="13">Optional CF Tunnel</text>
  <text x="960" y="304" text-anchor="middle" fill="#e0c57a" font-family="IBM Plex Mono, monospace" font-size="12">Humans only</text>

  <line x1="280" y1="200" x2="440" y2="200" stroke="#7eb8d4" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="250" x2="280" y2="250" stroke="#7eb8d4" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="680" y1="200" x2="840" y2="200" stroke="#e0c57a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="840" y1="250" x2="680" y2="250" stroke="#e0c57a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <text x="360" y="188" text-anchor="middle" fill="#7eb8d4" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="11">poll / mutate</text>
  <text x="760" y="188" text-anchor="middle" fill="#e0c57a" font-family="IBM Plex Sans, Segoe UI, sans-serif" font-size="11">REST + Clerk</text>
</svg>
